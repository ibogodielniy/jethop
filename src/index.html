<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JetHop — Flight Route Planner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan and visualize multi-leg flight routes on an interactive 3D world map. Search airports, chain legs, and see great-circle paths.">
  <link rel="canonical" href="https://jethop.app/">
  <meta name="theme-color" content="#0b0f1a">

  <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JetHop">
  <meta property="og:title" content="JetHop — Flight Route Planner">
  <meta property="og:description" content="Plan and visualize multi-leg flight routes on an interactive 3D world map.">
  <meta property="og:url" content="https://jethop.app/">
  <meta property="og:image" content="https://jethop.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JetHop — Flight Route Planner">
  <meta name="twitter:description" content="Plan and visualize multi-leg flight routes on an interactive 3D world map.">
  <meta name="twitter:image" content="https://jethop.app/og-image.png">

  <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Structured data: helps Google understand what this page is -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "JetHop",
    "url": "https://jethop.app/",
    "description": "Plan and visualize multi-leg flight routes on an interactive 3D world map.",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <!-- Cloudflare Web Analytics (free, cookieless). Loaded only on the live
       host so localhost dev traffic isn't counted. Replace the token below
       with the one from Cloudflare dashboard -> Web Analytics -> JetHop. -->
  <script>
    if (location.hostname === 'jethop.app') {
      var cf = document.createElement('script');
      cf.defer = true;
      cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      cf.setAttribute('data-cf-beacon', '{"token":"REPLACE_WITH_CLOUDFLARE_TOKEN","spa":true}');
      document.head.appendChild(cf);
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
